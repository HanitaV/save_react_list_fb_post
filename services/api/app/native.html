<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence System</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080d18;color:#dbe5f4;font:15px system-ui,sans-serif}header{padding:20px 28px;background:#101a2b;border-bottom:1px solid #293951;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:22px}h2{font-size:19px;margin:0 0 16px}nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px 28px;background:#0c1422}button,input,select{border:1px solid #385171;border-radius:8px;padding:9px 12px;background:#172842;color:#e5efff;font:inherit}button{cursor:pointer}button:hover{background:#265491}input{min-width:220px}main{max-width:1400px;margin:auto;padding:28px}.card{background:#111c2d;border:1px solid #283a54;border-radius:14px;padding:20px;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px}.cards .card{margin:0}.number{font-size:27px;font-weight:700;margin-top:8px}.muted{color:#94a8c1}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grow{flex:1}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #293951}th{font-size:12px;color:#9aafca;text-transform:uppercase}a{color:#8bb9ff;cursor:pointer}small{color:#9aafca}.pill{display:inline-block;padding:3px 8px;border-radius:7px;background:#244169}#notice{padding:10px 28px;color:#ffcd81;min-height:39px}.detail{word-break:break-all}pre{white-space:pre-wrap;word-break:break-word}
</style></head><body><header><h1>Facebook Engagement Evidence System</h1><span id="health" class="pill">Local Python mode</span></header><nav id="nav"></nav><div id="notice"></div><main id="content"></main>
<script>
const pages=["Dashboard","Posts","Actors","Clusters","Evidence","System","Settings"];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const token=()=>localStorage.getItem("evidence_token")||"";
async function call(path,options={}){const r=await fetch(path,{...options,headers:{Authorization:`Bearer ${token()}`,...options.headers}});if(!r.ok)throw Error(`${r.status}: ${(await r.text()).slice(0,200)}`);return r.headers.get("content-type")?.includes("application/json")?r.json():r.blob()}
function notice(s){$("notice").textContent=s||""}
function go(page,id){location.hash=`#${page}${id?"/"+id:""}`;render()}
function table(headers,rows){return `<div class="table"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function link(page,id,label){return `<a data-page="${esc(page)}" data-id="${esc(id)}">${esc(label)}</a>`}
function card(title,body){return `<section class="card"><h2>${esc(title)}</h2>${body}</section>`}
let graphMinimum=2,graphPost="ALL";
function clusterGraph(d){const members=d.members.slice(0,80),coords=new Map(members.map((m,i)=>[m.actor_id,{x:400+300*Math.cos(i*2*Math.PI/members.length),y:340+280*Math.sin(i*2*Math.PI/members.length)}]));const edges=(d.metadata.edges||[]).filter(e=>e.weight>=graphMinimum&&(graphPost==="ALL"||e.shared_post_ids?.includes(graphPost))&&coords.has(e.source)&&coords.has(e.target));return `<div class="row"><label>Minimum shared posts <input id="graphMinimum" type="number" min="1" value="${graphMinimum}"></label><select id="graphPost"><option>ALL</option>${(d.metadata.post_ids||[]).map(p=>`<option ${p===graphPost?"selected":""}>${esc(p)}</option>`).join("")}</select></div><p class="muted">${edges.length} visible connections · first ${members.length} actors</p><svg viewBox="0 0 800 680" style="width:100%;max-height:680px;background:#0b1422;border-radius:12px">${edges.map(e=>{const a=coords.get(e.source),b=coords.get(e.target);return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#3e6ba5" stroke-width="1.5"/>`}).join("")}${members.map(m=>{const p=coords.get(m.actor_id);return `<g><circle cx="${p.x}" cy="${p.y}" r="14" fill="#3269c0"/><text x="${p.x+17}" y="${p.y+4}" fill="#e5efff" font-size="10">${esc(m.actor_id.slice(0,8))}</text></g>`}).join("")}</svg>`}
async function render(){const [page="Dashboard",id]=location.hash.slice(1).split("/");$("nav").innerHTML=pages.map(p=>`<button data-page="${p}">${p}</button>`).join("");notice("");try{let html="";
if(page==="Settings")html=card("Admin sign in",`<div class="row"><input id="password" type="password" placeholder="ADMIN_PASSWORD"><button id="login">Sign in</button></div><p class="muted">The password is configured in .env or the process environment.</p>`);
if(page==="Dashboard"||page==="System"){const d=await call("/api/system/status");$("health").textContent=`Browser: ${d.browser_health}`;html=`<h2>${page}</h2>${d.browser_health==="NEEDS_MANUAL_REVIEW"?'<button id="resume">Resume after manual review</button>':""}<div class="cards">${Object.entries(d).map(([k,v])=>`<div class="card"><div class="muted">${esc(k.replaceAll("_"," "))}</div><div class="number">${esc(typeof v==="object"?`${v.mode}: ${v.pending??"unavailable"}`:v)}</div></div>`).join("")}</div>`}
if(page==="Posts"&&!id){const d=await call("/api/posts");html=card("Add and import",`<div class="row"><input class="grow" id="posturl" placeholder="HTTPS Facebook post URL"><button id="addpost">Add post</button><input id="csv" type="file" accept=".csv"></div>`)+card("Monitored posts",table(["Post","Status","Interactions","Scanned"],d.map(p=>[link("Posts",p.id,p.url),esc(p.status),esc(p.interaction_count),esc(p.last_scanned_at||"—")])))}
if(page==="Posts"&&id){const d=await call(`/api/posts/${id}`);html=`<h2>Post</h2><p class="detail">${esc(d.url)}</p><div class="row"><button id="analyze">Analyze</button><button id="export">Export ZIP</button></div><div class="cards"><div class="card">Interactions<div class="number">${d.interaction_count}</div></div><div class="card">Unique actors<div class="number">${d.unique_actors}</div></div></div>`+card("Reaction distribution",Object.entries(d.reaction_distribution).map(([k,v])=>`<span class="pill">${esc(k)}: ${v}</span> `).join(""))+card("Interactions",table(["Actor","Type","Observed","Score"],d.interactions.map(r=>[link("Actors",r.actor_id,r.actor_name||r.actor_id),esc(r.type),esc(r.observed_at),esc(r.score)])))}
if(page==="Actors"&&!id||page==="Evidence"){const d=await call(`/api/actors${page==="Evidence"?"?min_score=50":""}`);html=`<h2>${page}</h2>`+card("Actor list",table(["Actor","Hash","Score","Status"],d.map(a=>[link("Actors",a.id,a.display_name||"Unnamed"),`<small>${esc(a.actor_hash.slice(0,18))}…</small>`,esc(a.suspicion_score),`<span class="pill">${esc(a.status)}</span>`])))}
if(page==="Actors"&&id){const d=await call(`/api/actors/${id}`);html=`<h2>${esc(d.display_name||"Actor")}</h2><p class="detail"><small>${esc(d.actor_hash)}</small></p><div class="cards"><div class="card">Score<div class="number">${d.suspicion_score}/100</div></div><div class="card">Status<div class="number">${esc(d.status)}</div></div><div class="card">Evidence chain<div class="number">${esc(d.evidence_verification)}</div></div></div>`+card("Profile",`<p>First seen: ${esc(d.first_seen)}<br>Last seen: ${esc(d.last_seen)}</p>${d.public_profile_url?`<a href="${esc(d.public_profile_url)}" target="_blank" rel="noopener">Public profile ↗</a>`:""}`)+card("Heuristic signals",`<p class="muted">These signals identify candidates for review.</p>${d.reasons.map(r=>`<p>+${r.points} ${esc(r.type.replaceAll("_"," "))} · confidence ${r.confidence}</p>`).join("")}`)+card("Evidence",`<button id="capture">Queue capture</button>${d.snapshots.map(s=>`<p>${esc(s.captured_at)} · ${esc(s.capture_status)} · <small>${esc(s.sha256)}</small></p>`).join("")}`)+card("Related posts",d.post_ids.map(p=>`<p>${link("Posts",p,p)}</p>`).join(""))+card("Clusters",d.cluster_ids.map(c=>`<p>${link("Clusters",c,c)}</p>`).join(""))}
if(page==="Clusters"&&!id){const d=await call("/api/clusters");html=card("Clusters",table(["Type","Members","Confidence"],d.map(c=>[link("Clusters",c.id,c.type),esc(c.member_count),esc(Math.round(c.confidence*100)+"%")])))}
if(page==="Clusters"&&id){const d=await call(`/api/clusters/${id}`);html=card(`${d.type} cluster`,`<p>Confidence ${Math.round(d.confidence*100)}%</p>${clusterGraph(d)}`)+card("Members",table(["Actor","Score"],d.members.map(m=>[link("Actors",m.actor_id,m.actor_id),esc(m.score)])))}
$("content").innerHTML=html;
}catch(e){$("content").innerHTML=card("Unable to load",`<p>${esc(e.message)}</p><p>Sign in under Settings if authorization is required.</p>`)}}
document.addEventListener("click",async e=>{const t=e.target.closest("button,a");if(!t)return;if(t.dataset.page){e.preventDefault();go(t.dataset.page,t.dataset.id);return}try{const [page,id]=location.hash.slice(1).split("/");if(t.id==="login"){const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value})});if(!r.ok)throw Error("Invalid credentials");localStorage.setItem("evidence_token",(await r.json()).access_token);go("Dashboard")}if(t.id==="resume"){await call("/api/system/resume",{method:"POST"});render()}if(t.id==="addpost"){await call("/api/posts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({urls:$("posturl").value.split(/\s+/).filter(Boolean)})});render()}if(t.id==="analyze"){await call(`/api/analyze/post/${id}`,{method:"POST"});render()}if(t.id==="capture"){const r=await call(`/api/evidence/capture/${id}`,{method:"POST"});notice(r.status)}if(t.id==="export"){const blob=await call(`/api/reports/post/${id}`,{method:"POST"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`report-${id}.zip`;a.click();URL.revokeObjectURL(a.href)}}catch(err){notice(err.message)}});
document.addEventListener("change",async e=>{if(e.target.id==="graphMinimum"){graphMinimum=Math.max(1,Number(e.target.value));render();return}if(e.target.id==="graphPost"){graphPost=e.target.value;render();return}if(e.target.id!=="csv")return;try{const form=new FormData();form.append("file",e.target.files[0]);const r=await call("/api/import/csv",{method:"POST",body:form});render();notice(`Imported ${r.inserted} interactions`)}catch(err){notice(err.message)}});
window.addEventListener("hashchange",render);render();
</script></body></html>
