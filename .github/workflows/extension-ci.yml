name: Extension checks

on:
  pull_request:
    paths:
      - 'extension/**'
      - '.github/workflows/extension-ci.yml'
  push:
    paths:
      - 'extension/**'
      - '.github/workflows/extension-ci.yml'

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check extension/inspector.js
          node --check extension/reaction-collector.js
          node --check extension/background.js
          node --check extension/popup.js
          node --check extension/tests/inspector.test.cjs
          node --check extension/tests/reaction-collector.test.cjs
      - name: Unit tests
        working-directory: extension
        run: npm test
