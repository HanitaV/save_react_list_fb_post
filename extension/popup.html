<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facebook Engagement Inspector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
  <header><div class="eyebrow">ONE-CLICK · LOCAL INSPECTION</div>
    <h1>Engagement Inspector</h1>
    <p>Mở một bài Facebook và bấm nút để đọc reaction, sau đó kiểm tra wall của các hồ sơ nhìn thấy được.</p>
  </header>
  <div id="message" role="status" class="notice">Sẵn sàng kiểm tra một bài đăng.</div>
  <button class="primary" id="start" type="button">Quét reaction + kiểm tra wall</button>
  <section id="result" hidden>
    <div class="section-title">TIẾN ĐỘ</div>
    <div class="stats">
      <div><span>Tài khoản đã đọc</span><strong id="total">0</strong></div>
      <div><span>Đã kiểm tra</span><strong id="progress">0</strong></div>
    </div>
    <div class="progress-track"><div id="progressBar"></div></div>
    <div class="section-title">KẾT QUẢ</div>
    <ol id="profiles"></ol>
    <button class="secondary" type="button" id="export">Xuất toàn bộ kết quả JSON</button>
  </section>
  <footer>
    <span>Tối đa 20 hồ sơ/lượt; không vượt quyền riêng tư.</span>
    <button type="button" class="text-button" id="clear">Xóa kết quả</button>
  </footer>
</main>
<script src="popup.js"></script>
</body>
</html>
